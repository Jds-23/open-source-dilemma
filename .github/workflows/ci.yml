name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract (cargo test, rustc 1.85)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/dilemma
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/dilemma
      - run: cargo test --locked

  cards:
    name: cards contract (cargo test, rustc 1.85)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/cards
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/cards
      - run: cargo test --locked

  wasm:
    name: wasm (wasm32-wasip2 release build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wasm/referee
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm/referee
      - name: Native tests (mocked HTTP, fixtures)
        run: cargo test --locked
      - run: cargo build --locked --release --target wasm32-wasip2
      - name: WASM size and sha256
        run: |
          ls -l target/wasm32-wasip2/release/referee-wasm.wasm
          sha256sum target/wasm32-wasip2/release/referee-wasm.wasm

  js:
    name: js (pnpm lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run lint
      - run: pnpm -r --if-present run test

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks version
      - name: Scan git history
        run: ./gitleaks git . --no-banner --redact --exit-code 1 -v
