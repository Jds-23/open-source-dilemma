[package]
name = "referee-wasm"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasi-http-client = "0.2"
sha2 = "0.10"
hkdf = "0.12"
hex = "0.4"
base64 = "0.21"
ecies = { version = "0.2", default-features = false, features = ["pure"] }
libsecp256k1 = "0.7"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
