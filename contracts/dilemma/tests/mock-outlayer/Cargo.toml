# Test-only stand-in for outlayer.testnet `request_execution`: returns a canned referee
# output per match_key (fixtures), records every request. Built by tests/integration.rs.
[package]
name = "mock-outlayer"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "=5.9.0" }
serde_json = "1.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
